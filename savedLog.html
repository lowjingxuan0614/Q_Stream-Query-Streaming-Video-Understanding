<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Log - AI Video Query</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#165DFF', secondary: '#36CFC9' },
                    fontFamily: { inter: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .btn-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
            }
        }
    </style>
    <style>
        .page-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .saved-log-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .saved-log-select {
            width: 100%;
            max-width: 320px;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            background: white;
            color: #111827;
            font-size: 14px;
        }

        .saved-log-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .saved-log-delete {
            padding: 12px 14px;
            border: 1px solid #fecaca;
            border-radius: 12px;
            background: #fef2f2;
            color: #991b1b;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .saved-log-delete:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .saved-log-container {
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            background: #f8fafc;
            padding: 20px;
        }

        .saved-log-entry {
            padding: 10px 12px;
            border-radius: 10px;
            background: white;
            border: 1px solid #e5e7eb;
            color: #374151;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .saved-log-entry:last-child {
            margin-bottom: 0;
        }

        .saved-log-empty {
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body class="font-inter bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-md fixed w-full z-50 relative">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4 pl-8">
                <a href="main.html" class="text-xl font-bold text-primary flex items-center gap-2">
                    <i class="fas fa-video"></i> AI Video Query
                </a>
            </div>
            <div class="flex items-center gap-4">
                <a href="savedLog.html" class="text-primary font-semibold flex items-center gap-2"><i class="fas fa-bookmark"></i> Bookmark</a>
                <a href="/logout" class="px-4 py-2 bg-primary text-white rounded-lg btn-hover">Log Out</a>
            </div>
        </div>
    </nav>

    <main class="pt-2 pb-10">
        <div class="page-content">
            <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow p-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Saved Log</h1>
            <p class="text-gray-600 mb-6">Choose a video to view its matching saved log.</p>

            <div class="saved-log-toolbar">
                <label for="savedLogVideo" class="text-sm font-semibold text-gray-700">Select video log</label>
                <div class="saved-log-controls">
                    <select id="savedLogVideo" class="saved-log-select">
                        <option value="">Loading saved logs...</option>
                    </select>
                    <button id="deleteSavedLog" class="saved-log-delete" type="button" disabled>Delete</button>
                </div>
            </div>

            <div class="saved-log-container" id="savedLogContainer"></div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = window.location.origin;
        const savedLogVideo = document.getElementById('savedLogVideo');
        const savedLogContainer = document.getElementById('savedLogContainer');
        const deleteSavedLog = document.getElementById('deleteSavedLog');
        let savedBookmarks = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireLogin();
            if (user) {
                loadSavedLogs();
            }
        });

        async function requireLogin() {
            try {
                const res = await fetch(`${API_BASE}/api/me`);
                if (!res.ok) {
                    window.location.href = 'login.html';
                    return null;
                }

                const data = await res.json();
                return data.user;
            } catch (err) {
                console.error(err);
                window.location.href = 'login.html';
                return null;
            }
        }

        async function loadSavedLogs() {
            try {
                const res = await fetch(`${API_BASE}/api/bookmarks`);
                if (res.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }

                if (!res.ok) {
                    throw new Error(`Failed to load bookmarks: ${res.status}`);
                }

                const data = await res.json();
                savedBookmarks = data.bookmarks || [];
                renderBookmarkOptions();
            } catch (err) {
                console.error(err);
                renderMessage('Unable to load saved logs.');
            }
        }

        function renderBookmarkOptions() {
            savedLogVideo.innerHTML = '';

            if (!savedBookmarks.length) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'No saved logs yet';
                savedLogVideo.appendChild(option);
                savedLogVideo.disabled = true;
                deleteSavedLog.disabled = true;
                renderMessage('No saved bookmarks yet.');
                return;
            }

            savedBookmarks.forEach((bookmark, index) => {
                const option = document.createElement('option');
                option.value = bookmark.id;
                option.textContent = bookmarkLabel(bookmark, index);
                savedLogVideo.appendChild(option);
            });

            savedLogVideo.disabled = false;
            deleteSavedLog.disabled = false;
            renderSelectedLog();
        }

        function bookmarkLabel(bookmark, index) {
            const title = bookmark.video_title || bookmark.video_id || `Saved log ${index + 1}`;
            const created = new Date(`${bookmark.created_at}Z`);
            const dateText = Number.isNaN(created.getTime())
                ? bookmark.created_at
                : created.toLocaleString();

            return `${title} - ${dateText}`;
        }

        function renderSelectedLog() {
            const bookmark = savedBookmarks.find(item => String(item.id) === savedLogVideo.value);

            if (!bookmark) {
                renderMessage('Select a saved log to view it.');
                return;
            }

            savedLogContainer.innerHTML = '';
            const entries = bookmark.log_text.split('\n').filter(Boolean);

            entries.forEach(entryText => {
                const entry = document.createElement('div');
                entry.className = 'saved-log-entry';
                entry.textContent = entryText;
                savedLogContainer.appendChild(entry);
            });
        }

        savedLogVideo.addEventListener('change', event => {
            renderSelectedLog(event.target.value);
        });

        deleteSavedLog.addEventListener('click', async () => {
            const bookmarkId = savedLogVideo.value;
            if (!bookmarkId) return;

            const confirmed = confirm('Delete this saved log?');
            if (!confirmed) return;

            try {
                const res = await fetch(`${API_BASE}/api/bookmarks/${bookmarkId}`, {
                    method: 'DELETE'
                });

                if (res.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.error || `Delete failed with status ${res.status}`);
                }

                savedBookmarks = savedBookmarks.filter(item => String(item.id) !== bookmarkId);
                renderBookmarkOptions();
            } catch (err) {
                console.error(err);
                alert(`Failed to delete saved log: ${err.message}`);
            }
        });

        function renderMessage(text) {
            savedLogContainer.innerHTML = '';
            const message = document.createElement('div');
            message.className = 'saved-log-empty';
            message.textContent = text;
            savedLogContainer.appendChild(message);
        }
    </script>
</body>
</html>
