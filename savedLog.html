<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Log - AI Video Query</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#165DFF', secondary: '#36CFC9' },
                    fontFamily: { inter: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .btn-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
            }
        }
    </style>
    <style>
        .page-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .saved-log-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .saved-log-select {
            width: 100%;
            max-width: 320px;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            background: white;
            color: #111827;
            font-size: 14px;
        }

        .saved-log-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .saved-log-status {
            min-height: 20px;
            margin: -8px 0 16px;
            color: #64748b;
            font-size: 14px;
        }

        .saved-log-status.success {
            color: #047857;
        }

        .saved-log-status.error {
            color: #b91c1c;
        }

        .saved-log-delete {
            padding: 12px 14px;
            border: 1px solid #fecaca;
            border-radius: 12px;
            background: #fef2f2;
            color: #991b1b;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .saved-log-delete:not(:disabled):hover {
            background: #fee2e2;
            border-color: #fca5a5;
        }

        .saved-log-delete:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .saved-video-wrap {
            display: none;
            margin-bottom: 18px;
            border: 1px solid #dbeafe;
            border-radius: 16px;
            background: #eff6ff;
            padding: 14px;
        }

        .saved-video-wrap.show {
            display: block;
        }

        .saved-video-title {
            margin-bottom: 10px;
            color: #1e3a8a;
            font-size: 14px;
            font-weight: 700;
        }

        .saved-video-player {
            width: 100%;
            max-height: 520px;
            border-radius: 12px;
            background: #000;
        }

        .saved-log-threads-title {
            margin: 22px 0 10px;
            color: #1f2937;
            font-size: 16px;
            font-weight: 700;
        }

        .saved-log-container {
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            background: #f8fafc;
            padding: 20px;
        }

        .saved-log-entry {
            padding: 10px 12px;
            border-radius: 10px;
            background: white;
            border: 1px solid #e5e7eb;
            color: #374151;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            justify-content: space-between;
        }

        .saved-log-entry:last-child {
            margin-bottom: 0;
        }

        .saved-log-entry-text {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .saved-log-entry-remove {
            width: 36px;
            height: 36px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            background: #fef2f2;
            color: #991b1b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .saved-log-entry-remove:not(:disabled):hover {
            background: #fee2e2;
            border-color: #fca5a5;
        }

        .saved-log-entry-remove:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .saved-log-empty {
            color: #64748b;
            font-size: 14px;
        }

        .saved-qa-panel {
            margin-top: 22px;
            border: 1px solid #dbeafe;
            border-radius: 16px;
            background: #ffffff;
            padding: 18px;
        }

        .saved-qa-title {
            color: #1e3a8a;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .saved-qa-description {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .saved-qa-input-wrap {
            position: relative;
            margin-bottom: 12px;
        }

        .saved-qa-input {
            width: 100%;
            min-height: 44px;
            max-height: 120px;
            padding: 11px 52px 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            resize: vertical;
            font-size: 14px;
            line-height: 1.5;
        }

        .saved-qa-input:focus {
            border-color: #165DFF;
            outline: none;
            box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.12);
        }

        .saved-qa-send {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #165DFF;
            cursor: pointer;
            font-size: 16px;
            padding: 6px;
        }

        .saved-qa-send:disabled {
            cursor: wait;
            opacity: 0.5;
        }

        .saved-qa-answer-box {
            min-height: 100px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #f8fafc;
            padding: 12px;
        }

        .saved-qa-answer-title {
            color: #374151;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .saved-qa-answer {
            color: #374151;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .saved-qa-evidence {
            display: none;
            margin-top: 10px;
            border-radius: 8px;
            background: #eff6ff;
            color: #334155;
            padding: 10px;
            font-size: 13px;
            line-height: 1.55;
        }

        .saved-qa-evidence.show {
            display: block;
        }

        .saved-qa-timelines {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 9px;
        }

        .saved-qa-timeline {
            border: 1px solid #93c5fd;
            border-radius: 999px;
            background: white;
            color: #1d4ed8;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 10px;
        }

        .saved-qa-timeline:hover {
            background: #dbeafe;
        }

        .saved-qa-timeline-static {
            border-radius: 999px;
            background: #e2e8f0;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 10px;
        }
    </style>
</head>
<body class="font-inter bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-md fixed w-full z-50 relative">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4 pl-8">
                <a href="main.html" class="text-xl font-bold text-primary flex items-center gap-2">
                    <i class="fas fa-video"></i> AI Video Query
                </a>
            </div>
            <div class="flex items-center gap-4">
                <a href="savedLog.html" class="text-primary font-semibold flex items-center gap-2"><i class="fas fa-bookmark"></i> Bookmark</a>
                <a href="/logout" class="px-4 py-2 bg-primary text-white rounded-lg btn-hover">Log Out</a>
            </div>
        </div>
    </nav>

    <main class="pt-2 pb-10">
        <div class="page-content">
            <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow p-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Saved Log</h1>
            <p class="text-gray-600 mb-6">Choose a video to view its matching saved log.</p>

            <div class="saved-log-toolbar">
                <label for="savedLogVideo" class="text-sm font-semibold text-gray-700">Select video log</label>
                <div class="saved-log-controls">
                    <select id="savedLogVideo" class="saved-log-select">
                        <option value="">Loading saved logs...</option>
                    </select>
                    <button id="deleteSavedLog" class="saved-log-delete" type="button" disabled>
                        <i class="fas fa-trash" aria-hidden="true"></i>
                        <span>Delete log</span>
                    </button>
                </div>
            </div>

            <p class="saved-log-status" id="savedLogStatus" aria-live="polite"></p>
            <div class="saved-video-wrap" id="savedVideoWrap">
                <div class="saved-video-title" id="savedVideoTitle">Recorded camera video</div>
                <video class="saved-video-player" id="savedVideoPlayer" controls playsinline preload="metadata"></video>
            </div>
            <section class="saved-qa-panel" aria-labelledby="savedQaTitle">
                <div class="saved-qa-title" id="savedQaTitle">💬 Question & Answer</div>
                <p class="saved-qa-description">
                    The answer is generated only from the saved log currently selected above.
                </p>
                <div class="saved-qa-input-wrap">
                    <textarea
                        class="saved-qa-input"
                        id="savedLogQuestion"
                        placeholder="Ask a question about the selected saved log..."
                    ></textarea>
                    <button
                        class="saved-qa-send"
                        id="savedLogQuestionButton"
                        type="button"
                        aria-label="Ask selected saved log"
                    >
                        <i class="fas fa-paper-plane" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="saved-qa-answer-box">
                    <div class="saved-qa-answer-title">Answer:</div>
                    <div class="saved-qa-answer" id="savedLogAnswer">
                        Select a saved log, then ask a question.
                    </div>
                    <div class="saved-qa-evidence" id="savedLogEvidence"></div>
                </div>
            </section>

            <div class="saved-log-threads-title">Saved Log Threads</div>
            <div class="saved-log-container" id="savedLogContainer"></div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = "http://localhost:5500";
        const AI_BASE = "http://localhost:8000";
        const MODEL_NAME = "qwen2.5vl:7b";
        const SAVED_LOG_MAX_EVIDENCE = 8;

        function apiFetch(path, options = {}) {
            return fetch(`${API_BASE}${path}`, {
                ...options,
                credentials: "include"
            });
        }
        const savedLogVideo = document.getElementById('savedLogVideo');
        const savedLogContainer = document.getElementById('savedLogContainer');
        const savedLogStatus = document.getElementById('savedLogStatus');
        const deleteSavedLog = document.getElementById('deleteSavedLog');
        const savedVideoWrap = document.getElementById('savedVideoWrap');
        const savedVideoPlayer = document.getElementById('savedVideoPlayer');
        const savedVideoTitle = document.getElementById('savedVideoTitle');
        const savedLogQuestion = document.getElementById('savedLogQuestion');
        const savedLogQuestionButton = document.getElementById('savedLogQuestionButton');
        const savedLogAnswer = document.getElementById('savedLogAnswer');
        const savedLogEvidence = document.getElementById('savedLogEvidence');
        let savedBookmarks = [];
        let isRemovingEntry = false;
        let isDeletingLog = false;
        let isAskingSavedLog = false;
        let currentVideoObjectUrl = null;

        const RECORDING_DB_NAME = "QStreamCameraRecordings";
        const RECORDING_DB_VERSION = 1;
        const RECORDING_STORE_NAME = "recordings";

        function openRecordingDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(RECORDING_DB_NAME, RECORDING_DB_VERSION);

                request.addEventListener("upgradeneeded", () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains(RECORDING_STORE_NAME)) {
                        db.createObjectStore(RECORDING_STORE_NAME, { keyPath: "bookmarkId" });
                    }
                });

                request.addEventListener("success", () => resolve(request.result));
                request.addEventListener("error", () => reject(
                    request.error || new Error("Unable to open the camera recording database.")
                ));
            });
        }

        async function getLocalRecording(bookmarkId) {
            const db = await openRecordingDatabase();
            try {
                return await new Promise((resolve, reject) => {
                    const transaction = db.transaction(RECORDING_STORE_NAME, "readonly");
                    const request = transaction.objectStore(RECORDING_STORE_NAME).get(String(bookmarkId));
                    request.addEventListener("success", () => resolve(request.result || null));
                    request.addEventListener("error", () => reject(
                        request.error || new Error("Unable to load the saved camera recording.")
                    ));
                });
            } finally {
                db.close();
            }
        }

        async function deleteLocalRecording(bookmarkId) {
            const db = await openRecordingDatabase();
            try {
                await new Promise((resolve, reject) => {
                    const transaction = db.transaction(RECORDING_STORE_NAME, "readwrite");
                    transaction.objectStore(RECORDING_STORE_NAME).delete(String(bookmarkId));
                    transaction.addEventListener("complete", resolve);
                    transaction.addEventListener("error", () => reject(
                        transaction.error || new Error("Unable to delete the saved camera recording.")
                    ));
                });
            } finally {
                db.close();
            }
        }

        function clearSavedVideo() {
            savedVideoPlayer.pause();
            savedVideoPlayer.removeAttribute('src');
            savedVideoPlayer.load();
            savedVideoWrap.classList.remove('show');

            if (currentVideoObjectUrl) {
                URL.revokeObjectURL(currentVideoObjectUrl);
                currentVideoObjectUrl = null;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireLogin();
            if (user) {
                loadSavedLogs();
            }
        });

        async function requireLogin() {
            try {
                const res = await apiFetch("/api/me");
                if (!res.ok) {
                    window.location.href = `${API_BASE}/login.html`;
                    return null;
                }

                const data = await res.json();
                return data.user;
            } catch (err) {
                console.error(err);
                window.location.href = `${API_BASE}/login.html`;
                return null;
            }
        }

        async function loadSavedLogs() {
            try {
                const res = await apiFetch("/api/bookmarks");
                if (res.status === 401) {
                    window.location.href = `${API_BASE}/login.html`;
                    return;
                }

                if (!res.ok) {
                    throw new Error(`Failed to load bookmarks: ${res.status}`);
                }

                const data = await res.json();
                savedBookmarks = data.bookmarks || [];
                renderBookmarkOptions();
            } catch (err) {
                console.error(err);
                renderStatus('Unable to load saved logs.', 'error');
                renderMessage('Unable to load saved logs.');
            }
        }

        function renderBookmarkOptions(selectedBookmarkId = '') {
            savedLogVideo.innerHTML = '';

            if (!savedBookmarks.length) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'No saved logs yet';
                savedLogVideo.appendChild(option);
                savedLogVideo.disabled = true;
                deleteSavedLog.disabled = true;
                renderMessage('No saved bookmarks yet.');
                return;
            }

            savedBookmarks.forEach((bookmark, index) => {
                const option = document.createElement('option');
                option.value = bookmark.id;
                option.textContent = bookmarkLabel(bookmark, index);
                savedLogVideo.appendChild(option);
            });

            savedLogVideo.disabled = false;
            deleteSavedLog.disabled = false;
            if (selectedBookmarkId) {
                savedLogVideo.value = selectedBookmarkId;
            }
            renderSelectedLog();
        }

        function bookmarkLabel(bookmark, index) {
            const title = bookmark.video_title || bookmark.video_id || `Saved log ${index + 1}`;
            const created = new Date(`${bookmark.created_at}Z`);
            const dateText = Number.isNaN(created.getTime())
                ? bookmark.created_at
                : created.toLocaleString();

            return `${title} - ${dateText}`;
        }

        async function renderSelectedLog() {
            const bookmark = selectedBookmark();

            if (!bookmark) {
                renderMessage('Select a saved log to view it.');
                return;
            }

            await renderSavedVideo(bookmark);
            savedLogContainer.innerHTML = '';
            const entries = bookmarkEntries(bookmark);

            if (!entries.length) {
                renderMessage('This saved log has no entries.');
                return;
            }

            entries.forEach((entryText, index) => {
                const entry = document.createElement('div');
                entry.className = 'saved-log-entry';

                const text = document.createElement('div');
                text.className = 'saved-log-entry-text';
                text.textContent = entryText;

                const removeButton = document.createElement('button');
                removeButton.className = 'saved-log-entry-remove';
                removeButton.type = 'button';
                removeButton.title = 'Remove this log entry';
                removeButton.setAttribute('aria-label', 'Remove this log entry');
                removeButton.disabled = isRemovingEntry;
                removeButton.innerHTML = '<i class="fas fa-trash" aria-hidden="true"></i>';
                removeButton.addEventListener('click', () => removeLogEntry(index));

                entry.appendChild(text);
                entry.appendChild(removeButton);
                savedLogContainer.appendChild(entry);
            });
        }

        savedLogVideo.addEventListener('change', event => {
            renderStatus('');
            resetSavedLogAnswer();
            renderSelectedLog(event.target.value);
        });

        savedLogQuestionButton.addEventListener('click', submitSavedLogQuestion);
        savedLogQuestion.addEventListener('keydown', event => {
            if (
                event.key === 'Enter' &&
                !event.shiftKey &&
                !event.isComposing
            ) {
                event.preventDefault();
                submitSavedLogQuestion();
            }
        });

        deleteSavedLog.addEventListener('click', async () => {
            if (isDeletingLog || isRemovingEntry) return;

            const bookmark = selectedBookmark();
            if (!bookmark) return;

            const label = bookmark.video_title || bookmark.video_id || 'this saved log';
            const confirmed = confirm(`Delete "${label}"? This removes the whole saved log.`);
            if (!confirmed) return;

            const bookmarkId = String(bookmark.id);
            const previousIndex = savedBookmarks.findIndex(item => String(item.id) === bookmarkId);
            setDeletingLog(true);
            renderStatus('');

            try {
                const res = await apiFetch(`/api/bookmarks/${bookmark.id}`, {
                    method: 'DELETE'
                });

                if (res.status === 401) {
                    window.location.href = `${API_BASE}/login.html`;
                    return;
                }

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.error || `Delete failed with status ${res.status}`);
                }

                try {
                    await deleteLocalRecording(bookmarkId);
                } catch (storageError) {
                    console.warn("The bookmark was deleted, but its local recording could not be removed:", storageError);
                }

                savedBookmarks = savedBookmarks.filter(item => String(item.id) !== bookmarkId);
                const nextBookmark = savedBookmarks[Math.min(previousIndex, savedBookmarks.length - 1)];
                renderBookmarkOptions(nextBookmark ? String(nextBookmark.id) : '');
                renderStatus('Saved log deleted.', 'success');
            } catch (err) {
                console.error(err);
                renderStatus(`Failed to delete saved log: ${err.message}`, 'error');
            } finally {
                setDeletingLog(false);
            }
        });

        async function removeLogEntry(entryIndex) {
            if (isRemovingEntry || isDeletingLog) return;

            const bookmark = selectedBookmark();
            if (!bookmark) return;

            const entries = bookmarkEntries(bookmark);
            const entryText = entries[entryIndex];
            if (!entryText) return;

            const confirmed = confirm('Remove this log entry?');
            if (!confirmed) return;

            const nextEntries = entries.filter((_, index) => index !== entryIndex);
            setRemovingEntry(true);
            renderStatus('');

            try {
                const res = await apiFetch(`/api/bookmarks/${bookmark.id}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        log_text: nextEntries.join("\n")
                    })
                });

                if (res.status === 401) {
                    window.location.href = `${API_BASE}/login.html`;
                    return;
                }

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.error || `Update failed with status ${res.status}`);
                }

                const data = await res.json();
                savedBookmarks = savedBookmarks.map(item =>
                    item.id === data.bookmark.id ? data.bookmark : item
                );
                renderBookmarkOptions(String(data.bookmark.id));
                renderStatus('Log entry removed.', 'success');
            } catch (err) {
                console.error(err);
                renderStatus(`Failed to remove log entry: ${err.message}`, 'error');
            } finally {
                setRemovingEntry(false);
            }
        }

        async function renderSavedVideo(bookmark) {
            clearSavedVideo();

            try {
                const localRecording = await getLocalRecording(bookmark.id);
                if (localRecording?.blob) {
                    savedVideoTitle.textContent = 'Recorded camera video';
                    currentVideoObjectUrl = URL.createObjectURL(localRecording.blob);
                    savedVideoPlayer.src = currentVideoObjectUrl;
                    savedVideoPlayer.load();
                    savedVideoWrap.classList.add('show');
                    return;
                }
            } catch (err) {
                console.error("Unable to load local camera recording:", err);
                renderStatus(`Saved log loaded, but its local video could not be opened: ${err.message}`, 'error');
            }

            // Backward compatibility for recordings previously saved by the server.
            const videoUrl = bookmark.video_url || bookmark.recording_url || '';
            if (videoUrl) {
                savedVideoTitle.textContent = 'Recorded camera video';
                savedVideoPlayer.src = videoUrl.startsWith('http')
                    ? videoUrl
                    : `${API_BASE}${videoUrl.startsWith('/') ? '' : '/'}${videoUrl}`;
                savedVideoPlayer.load();
                savedVideoWrap.classList.add('show');
                return;
            }

            // Dataset bookmarks can be reopened from the AutoDL video endpoint.
            if (bookmark.source_type === 'dataset' && bookmark.video_id) {
                savedVideoTitle.textContent = bookmark.video_title || 'Saved dataset video';
                savedVideoPlayer.src = `${AI_BASE}/video/${encodeURIComponent(bookmark.video_id)}`;
                savedVideoPlayer.load();
                savedVideoWrap.classList.add('show');
            }
        }

        function resetSavedLogAnswer() {
            savedLogAnswer.textContent = 'Ask a question about the selected saved log.';
            savedLogEvidence.classList.remove('show');
            savedLogEvidence.innerHTML = '';
        }

        function setSavedLogAsking(isAsking) {
            isAskingSavedLog = isAsking;
            savedLogQuestion.disabled = isAsking;
            savedLogQuestionButton.disabled = isAsking;
            savedLogQuestionButton.innerHTML = isAsking
                ? '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i>'
                : '<i class="fas fa-paper-plane" aria-hidden="true"></i>';
        }

        function formatTimeline(seconds) {
            const numeric = Number(seconds);
            if (!Number.isFinite(numeric) || numeric < 0) return null;
            const wholeSeconds = Math.floor(numeric);
            const minutes = Math.floor(wholeSeconds / 60);
            const remainingSeconds = wholeSeconds % 60;
            return `${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
        }

        async function seekSavedVideo(seconds, eventId) {
            const numeric = Number(seconds);
            if (!Number.isFinite(numeric) || numeric < 0 || !savedVideoPlayer.currentSrc) {
                return;
            }

            if (savedVideoPlayer.readyState < 1) {
                await new Promise(resolve => {
                    savedVideoPlayer.addEventListener('loadedmetadata', resolve, { once: true });
                });
            }

            savedVideoPlayer.currentTime = numeric;
            savedVideoWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
            await savedVideoPlayer.play().catch(() => {});
            renderStatus(`Opened Event #${eventId} at ${formatTimeline(numeric)}.`, 'success');
        }

        function renderSavedLogEvidence(data) {
            savedLogEvidence.innerHTML = '';

            if (data.has_relevant_evidence === false) {
                savedLogEvidence.classList.remove('show');
                return;
            }

            const detectedType =
                data.primary_question_type_7wh ||
                data.question_types_7wh?.[0] ||
                'Unknown';
            const retrievedCount = Number(data.retrieved_event_count || 0);
            const totalCount = Number(data.total_log_event_descriptions || 0);
            const eventIds = Array.isArray(data.retrieved_event_ids)
                ? data.retrieved_event_ids.join(', ')
                : '';

            const summary = document.createElement('div');
            summary.textContent =
                `Selected log only. Detected 7WH type: ${detectedType}. ` +
                `Retrieved ${retrievedCount}/${totalCount} saved-log event descriptions. ` +
                `Event IDs: ${eventIds || 'none'}.`;
            savedLogEvidence.appendChild(summary);

            const timelineEvents = Array.isArray(data.retrieved_events)
                ? data.retrieved_events.filter(event =>
                    Number.isFinite(Number(event.start_time)) &&
                    event.start_time !== null
                )
                : [];

            if (timelineEvents.length) {
                const timelineTitle = document.createElement('div');
                timelineTitle.style.marginTop = '8px';
                timelineTitle.style.fontWeight = '700';
                timelineTitle.textContent = 'Evidence timeline:';
                savedLogEvidence.appendChild(timelineTitle);

                const timelineWrap = document.createElement('div');
                timelineWrap.className = 'saved-qa-timelines';
                const canSeek = Boolean(savedVideoPlayer.currentSrc);

                timelineEvents.forEach(event => {
                    const label = formatTimeline(event.start_time);
                    if (!label) return;

                    if (canSeek) {
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.className = 'saved-qa-timeline';
                        button.textContent = `▶ ${label}`;
                        button.title = `Open Event #${event.event_id} at ${label}`;
                        button.addEventListener('click', () =>
                            seekSavedVideo(event.start_time, event.event_id)
                        );
                        timelineWrap.appendChild(button);
                    } else {
                        const item = document.createElement('span');
                        item.className = 'saved-qa-timeline-static';
                        item.textContent = `🕒 ${label}`;
                        timelineWrap.appendChild(item);
                    }
                });

                savedLogEvidence.appendChild(timelineWrap);
            }

            savedLogEvidence.classList.add('show');
        }

        async function submitSavedLogQuestion() {
            if (isAskingSavedLog) return;

            const bookmark = selectedBookmark();
            const question = savedLogQuestion.value.trim();

            if (!bookmark) {
                alert('Please select a saved log first.');
                return;
            }
            if (!question) {
                alert('Please enter a question.');
                return;
            }
            if (!(bookmark.log_text || '').trim()) {
                alert('The selected saved log is empty.');
                return;
            }

            // Clear immediately after a valid submission and keep the input ready.
            savedLogQuestion.value = '';
            savedLogQuestion.focus();
            savedLogAnswer.textContent = 'Retrieving an answer from the selected saved log only...';
            savedLogEvidence.classList.remove('show');
            savedLogEvidence.innerHTML = '';
            setSavedLogAsking(true);

            try {
                const response = await fetch(`${AI_BASE}/ask_saved_log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        bookmark_id: String(bookmark.id),
                        bookmark_title: bookmark.video_title || bookmark.video_id || 'Selected saved log',
                        log_text: bookmark.log_text || '',
                        question,
                        model: MODEL_NAME,
                        max_entries: SAVED_LOG_MAX_EVIDENCE
                    })
                });

                if (!response.ok) {
                    const message = await response.text();
                    throw new Error(message || `Saved-log Q&A failed with status ${response.status}`);
                }

                const data = await response.json();
                savedLogAnswer.textContent = data.answer || 'No answer was returned.';
                renderSavedLogEvidence(data);
                if (data.has_relevant_evidence === false) {
                    renderStatus('');
                } else {
                    renderStatus('Answer generated from the selected saved log only.', 'success');
                }
            } catch (err) {
                console.error(err);
                savedLogAnswer.textContent =
                    'Unable to answer from the selected saved log. Check the AutoDL API and try again.';
                renderStatus(`Saved-log Q&A failed: ${err.message}`, 'error');
            } finally {
                setSavedLogAsking(false);
                savedLogQuestion.focus();
            }
        }

        function selectedBookmark() {
            return savedBookmarks.find(item => String(item.id) === savedLogVideo.value);
        }

        function bookmarkEntries(bookmark) {
            return (bookmark.log_text || '')
                .split('\n')
                .filter(entry => entry.trim() !== '');
        }

        function setRemovingEntry(isRemoving) {
            isRemovingEntry = isRemoving;
            savedLogVideo.disabled = isRemoving || !savedBookmarks.length;
            deleteSavedLog.disabled = isRemoving || !savedBookmarks.length;
            savedLogContainer
                .querySelectorAll('.saved-log-entry-remove')
                .forEach(button => {
                    button.disabled = isRemoving;
                });
        }

        function setDeletingLog(isDeleting) {
            isDeletingLog = isDeleting;
            savedLogVideo.disabled = isDeleting || !savedBookmarks.length;
            deleteSavedLog.disabled = isDeleting || !savedBookmarks.length;
            deleteSavedLog.querySelector('span').textContent = isDeleting
                ? 'Deleting...'
                : 'Delete selected log';
            savedLogContainer
                .querySelectorAll('.saved-log-entry-remove')
                .forEach(button => {
                    button.disabled = isDeleting;
                });
        }

        function renderStatus(text, type = '') {
            savedLogStatus.className = `saved-log-status ${type}`.trim();
            savedLogStatus.textContent = text;
        }

        function renderMessage(text) {
            clearSavedVideo();
            savedLogContainer.innerHTML = '';
            const message = document.createElement('div');
            message.className = 'saved-log-empty';
            message.textContent = text;
            savedLogContainer.appendChild(message);
        }
    </script>
</body>
</html>
