<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Log - AI Video Query</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#165DFF', secondary: '#36CFC9' },
                    fontFamily: { inter: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .btn-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
            }
        }
    </style>
    <style>
        .page-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .saved-log-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .saved-log-select {
            width: 100%;
            max-width: 320px;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            background: white;
            color: #111827;
            font-size: 14px;
        }

        .saved-log-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .saved-log-status {
            min-height: 20px;
            margin: -8px 0 16px;
            color: #64748b;
            font-size: 14px;
        }

        .saved-log-status.success {
            color: #047857;
        }

        .saved-log-status.error {
            color: #b91c1c;
        }

        .saved-log-delete {
            padding: 12px 14px;
            border: 1px solid #fecaca;
            border-radius: 12px;
            background: #fef2f2;
            color: #991b1b;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .saved-log-delete:not(:disabled):hover {
            background: #fee2e2;
            border-color: #fca5a5;
        }

        .saved-log-delete:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .saved-video-wrap {
            display: none;
            margin-bottom: 18px;
            border: 1px solid #dbeafe;
            border-radius: 16px;
            background: #eff6ff;
            padding: 14px;
        }

        .saved-video-wrap.show {
            display: block;
        }

        .saved-video-title {
            margin-bottom: 10px;
            color: #1e3a8a;
            font-size: 14px;
            font-weight: 700;
        }

        .saved-video-player {
            width: 100%;
            max-height: 520px;
            border-radius: 12px;
            background: #000;
        }

        .saved-log-container {
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            background: #f8fafc;
            padding: 20px;
        }

        .saved-log-entry {
            padding: 10px 12px;
            border-radius: 10px;
            background: white;
            border: 1px solid #e5e7eb;
            color: #374151;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            justify-content: space-between;
        }

        .saved-log-entry:last-child {
            margin-bottom: 0;
        }

        .saved-log-entry-text {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .saved-log-entry-remove {
            width: 36px;
            height: 36px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            background: #fef2f2;
            color: #991b1b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .saved-log-entry-remove:not(:disabled):hover {
            background: #fee2e2;
            border-color: #fca5a5;
        }

        .saved-log-entry-remove:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .saved-log-empty {
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body class="font-inter bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-md fixed w-full z-50 relative">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4 pl-8">
                <a href="main.html" class="text-xl font-bold text-primary flex items-center gap-2">
                    <i class="fas fa-video"></i> AI Video Query
                </a>
            </div>
            <div class="flex items-center gap-4">
                <a href="savedLog.html" class="text-primary font-semibold flex items-center gap-2"><i class="fas fa-bookmark"></i> Bookmark</a>
                <a href="/logout" class="px-4 py-2 bg-primary text-white rounded-lg btn-hover">Log Out</a>
            </div>
        </div>
    </nav>

    <main class="pt-2 pb-10">
        <div class="page-content">
            <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow p-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Saved Log</h1>
            <p class="text-gray-600 mb-6">Choose a video to view its matching saved log.</p>

            <div class="saved-log-toolbar">
                <label for="savedLogVideo" class="text-sm font-semibold text-gray-700">Select video log</label>
                <div class="saved-log-controls">
                    <select id="savedLogVideo" class="saved-log-select">
                        <option value="">Loading saved logs...</option>
                    </select>
                    <button id="deleteSavedLog" class="saved-log-delete" type="button" disabled>
                        <i class="fas fa-trash" aria-hidden="true"></i>
                        <span>Delete log</span>
                    </button>
                </div>
            </div>

            <p class="saved-log-status" id="savedLogStatus" aria-live="polite"></p>
            <div class="saved-video-wrap" id="savedVideoWrap">
                <div class="saved-video-title">Recorded camera video</div>
                <video class="saved-video-player" id="savedVideoPlayer" controls playsinline preload="metadata"></video>
            </div>
            <div class="saved-log-container" id="savedLogContainer"></div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = "http://localhost:5500";

        function apiFetch(path, options = {}) {
            return fetch(`${API_BASE}${path}`, {
                ...options,
                credentials: "include"
            });
        }
        const savedLogVideo = document.getElementById('savedLogVideo');
        const savedLogContainer = document.getElementById('savedLogContainer');
        const savedLogStatus = document.getElementById('savedLogStatus');
        const deleteSavedLog = document.getElementById('deleteSavedLog');
        const savedVideoWrap = document.getElementById('savedVideoWrap');
        const savedVideoPlayer = document.getElementById('savedVideoPlayer');
        let savedBookmarks = [];
        let isRemovingEntry = false;
        let isDeletingLog = false;
        let currentVideoObjectUrl = null;

        const RECORDING_DB_NAME = "QStreamCameraRecordings";
        const RECORDING_DB_VERSION = 1;
        const RECORDING_STORE_NAME = "recordings";

        function openRecordingDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(RECORDING_DB_NAME, RECORDING_DB_VERSION);

                request.addEventListener("upgradeneeded", () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains(RECORDING_STORE_NAME)) {
                        db.createObjectStore(RECORDING_STORE_NAME, { keyPath: "bookmarkId" });
                    }
                });

                request.addEventListener("success", () => resolve(request.result));
                request.addEventListener("error", () => reject(
                    request.error || new Error("Unable to open the camera recording database.")
                ));
            });
        }

        async function getLocalRecording(bookmarkId) {
            const db = await openRecordingDatabase();
            try {
                return await new Promise((resolve, reject) => {
                    const transaction = db.transaction(RECORDING_STORE_NAME, "readonly");
                    const request = transaction.objectStore(RECORDING_STORE_NAME).get(String(bookmarkId));
                    request.addEventListener("success", () => resolve(request.result || null));
                    request.addEventListener("error", () => reject(
                        request.error || new Error("Unable to load the saved camera recording.")
                    ));
                });
            } finally {
                db.close();
            }
        }

        async function deleteLocalRecording(bookmarkId) {
            const db = await openRecordingDatabase();
            try {
                await new Promise((resolve, reject) => {
                    const transaction = db.transaction(RECORDING_STORE_NAME, "readwrite");
                    transaction.objectStore(RECORDING_STORE_NAME).delete(String(bookmarkId));
                    transaction.addEventListener("complete", resolve);
                    transaction.addEventListener("error", () => reject(
                        transaction.error || new Error("Unable to delete the saved camera recording.")
                    ));
                });
            } finally {
                db.close();
            }
        }

        function clearSavedVideo() {
            savedVideoPlayer.pause();
            savedVideoPlayer.removeAttribute('src');
            savedVideoPlayer.load();
            savedVideoWrap.classList.remove('show');

            if (currentVideoObjectUrl) {
                URL.revokeObjectURL(currentVideoObjectUrl);
                currentVideoObjectUrl = null;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireLogin();
            if (user) {
                loadSavedLogs();
            }
        });

        async function requireLogin() {
            try {
                const res = await apiFetch("/api/me");
                if (!res.ok) {
                    window.location.href = `${API_BASE}/login.html`;
                    return null;
                }

                const data = await res.json();
                return data.user;
            } catch (err) {
                console.error(err);
                window.location.href = `${API_BASE}/login.html`;
                return null;
            }
        }

        async function loadSavedLogs() {
            try {
                const res = await apiFetch("/api/bookmarks");
                if (res.status === 401) {
                    window.location.href = `${API_BASE}/login.html`;
                    return;
                }

                if (!res.ok) {
                    throw new Error(`Failed to load bookmarks: ${res.status}`);
                }

                const data = await res.json();
                savedBookmarks = data.bookmarks || [];
                renderBookmarkOptions();
            } catch (err) {
                console.error(err);
                renderStatus('Unable to load saved logs.', 'error');
                renderMessage('Unable to load saved logs.');
            }
        }

        function renderBookmarkOptions(selectedBookmarkId = '') {
            savedLogVideo.innerHTML = '';

            if (!savedBookmarks.length) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'No saved logs yet';
                savedLogVideo.appendChild(option);
                savedLogVideo.disabled = true;
                deleteSavedLog.disabled = true;
                renderMessage('No saved bookmarks yet.');
                return;
            }

            savedBookmarks.forEach((bookmark, index) => {
                const option = document.createElement('option');
                option.value = bookmark.id;
                option.textContent = bookmarkLabel(bookmark, index);
                savedLogVideo.appendChild(option);
            });

            savedLogVideo.disabled = false;
            deleteSavedLog.disabled = false;
            if (selectedBookmarkId) {
                savedLogVideo.value = selectedBookmarkId;
            }
            renderSelectedLog();
        }

        function bookmarkLabel(bookmark, index) {
            const title = bookmark.video_title || bookmark.video_id || `Saved log ${index + 1}`;
            const created = new Date(`${bookmark.created_at}Z`);
            const dateText = Number.isNaN(created.getTime())
                ? bookmark.created_at
                : created.toLocaleString();

            return `${title} - ${dateText}`;
        }

        async function renderSelectedLog() {
            const bookmark = selectedBookmark();

            if (!bookmark) {
                renderMessage('Select a saved log to view it.');
                return;
            }

            await renderSavedVideo(bookmark);
            savedLogContainer.innerHTML = '';
            const entries = bookmarkEntries(bookmark);

            if (!entries.length) {
                renderMessage('This saved log has no entries.');
                return;
            }

            entries.forEach((entryText, index) => {
                const entry = document.createElement('div');
                entry.className = 'saved-log-entry';

                const text = document.createElement('div');
                text.className = 'saved-log-entry-text';
                text.textContent = entryText;

                const removeButton = document.createElement('button');
                removeButton.className = 'saved-log-entry-remove';
                removeButton.type = 'button';
                removeButton.title = 'Remove this log entry';
                removeButton.setAttribute('aria-label', 'Remove this log entry');
                removeButton.disabled = isRemovingEntry;
                removeButton.innerHTML = '<i class="fas fa-trash" aria-hidden="true"></i>';
                removeButton.addEventListener('click', () => removeLogEntry(index));

                entry.appendChild(text);
                entry.appendChild(removeButton);
                savedLogContainer.appendChild(entry);
            });
        }

        savedLogVideo.addEventListener('change', event => {
            renderStatus('');
            renderSelectedLog(event.target.value);
        });

        deleteSavedLog.addEventListener('click', async () => {
            if (isDeletingLog || isRemovingEntry) return;

            const bookmark = selectedBookmark();
            if (!bookmark) return;

            const label = bookmark.video_title || bookmark.video_id || 'this saved log';
            const confirmed = confirm(`Delete "${label}"? This removes the whole saved log.`);
            if (!confirmed) return;

            const bookmarkId = String(bookmark.id);
            const previousIndex = savedBookmarks.findIndex(item => String(item.id) === bookmarkId);
            setDeletingLog(true);
            renderStatus('');

            try {
                const res = await apiFetch(`/api/bookmarks/${bookmark.id}`, {
                    method: 'DELETE'
                });

                if (res.status === 401) {
                    window.location.href = `${API_BASE}/login.html`;
                    return;
                }

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.error || `Delete failed with status ${res.status}`);
                }

                try {
                    await deleteLocalRecording(bookmarkId);
                } catch (storageError) {
                    console.warn("The bookmark was deleted, but its local recording could not be removed:", storageError);
                }

                savedBookmarks = savedBookmarks.filter(item => String(item.id) !== bookmarkId);
                const nextBookmark = savedBookmarks[Math.min(previousIndex, savedBookmarks.length - 1)];
                renderBookmarkOptions(nextBookmark ? String(nextBookmark.id) : '');
                renderStatus('Saved log deleted.', 'success');
            } catch (err) {
                console.error(err);
                renderStatus(`Failed to delete saved log: ${err.message}`, 'error');
            } finally {
                setDeletingLog(false);
            }
        });

        async function removeLogEntry(entryIndex) {
            if (isRemovingEntry || isDeletingLog) return;

            const bookmark = selectedBookmark();
            if (!bookmark) return;

            const entries = bookmarkEntries(bookmark);
            const entryText = entries[entryIndex];
            if (!entryText) return;

            const confirmed = confirm('Remove this log entry?');
            if (!confirmed) return;

            const nextEntries = entries.filter((_, index) => index !== entryIndex);
            setRemovingEntry(true);
            renderStatus('');

            try {
                const res = await apiFetch(`/api/bookmarks/${bookmark.id}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        log_text: nextEntries.join("\n")
                    })
                });

                if (res.status === 401) {
                    window.location.href = `${API_BASE}/login.html`;
                    return;
                }

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.error || `Update failed with status ${res.status}`);
                }

                const data = await res.json();
                savedBookmarks = savedBookmarks.map(item =>
                    item.id === data.bookmark.id ? data.bookmark : item
                );
                renderBookmarkOptions(String(data.bookmark.id));
                renderStatus('Log entry removed.', 'success');
            } catch (err) {
                console.error(err);
                renderStatus(`Failed to remove log entry: ${err.message}`, 'error');
            } finally {
                setRemovingEntry(false);
            }
        }

        async function renderSavedVideo(bookmark) {
            clearSavedVideo();

            try {
                const localRecording = await getLocalRecording(bookmark.id);
                if (localRecording?.blob) {
                    currentVideoObjectUrl = URL.createObjectURL(localRecording.blob);
                    savedVideoPlayer.src = currentVideoObjectUrl;
                    savedVideoPlayer.load();
                    savedVideoWrap.classList.add('show');
                    return;
                }
            } catch (err) {
                console.error("Unable to load local camera recording:", err);
                renderStatus(`Saved log loaded, but its local video could not be opened: ${err.message}`, 'error');
            }

            // Backward compatibility for recordings previously saved by the server.
            const videoUrl = bookmark.video_url || bookmark.recording_url || '';
            if (videoUrl) {
                savedVideoPlayer.src = videoUrl.startsWith('http')
                    ? videoUrl
                    : `${API_BASE}${videoUrl.startsWith('/') ? '' : '/'}${videoUrl}`;
                savedVideoPlayer.load();
                savedVideoWrap.classList.add('show');
            }
        }

        function selectedBookmark() {
            return savedBookmarks.find(item => String(item.id) === savedLogVideo.value);
        }

        function bookmarkEntries(bookmark) {
            return (bookmark.log_text || '')
                .split('\n')
                .filter(entry => entry.trim() !== '');
        }

        function setRemovingEntry(isRemoving) {
            isRemovingEntry = isRemoving;
            savedLogVideo.disabled = isRemoving || !savedBookmarks.length;
            deleteSavedLog.disabled = isRemoving || !savedBookmarks.length;
            savedLogContainer
                .querySelectorAll('.saved-log-entry-remove')
                .forEach(button => {
                    button.disabled = isRemoving;
                });
        }

        function setDeletingLog(isDeleting) {
            isDeletingLog = isDeleting;
            savedLogVideo.disabled = isDeleting || !savedBookmarks.length;
            deleteSavedLog.disabled = isDeleting || !savedBookmarks.length;
            deleteSavedLog.querySelector('span').textContent = isDeleting
                ? 'Deleting...'
                : 'Delete selected log';
            savedLogContainer
                .querySelectorAll('.saved-log-entry-remove')
                .forEach(button => {
                    button.disabled = isDeleting;
                });
        }

        function renderStatus(text, type = '') {
            savedLogStatus.className = `saved-log-status ${type}`.trim();
            savedLogStatus.textContent = text;
        }

        function renderMessage(text) {
            clearSavedVideo();
            savedLogContainer.innerHTML = '';
            const message = document.createElement('div');
            message.className = 'saved-log-empty';
            message.textContent = text;
            savedLogContainer.appendChild(message);
        }
    </script>
</body>
</html>
